<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>tutorizr call</title>
    <link rel="icon" href="data:,">
    <script src="_framework/hybridwebview.js"></script>
    <script>
        // Owns the microphone, WebRTC media and the filtered event channel. The host exchanges SDP with the
        // Agent Runtime; this page never sees tokens, instructions or tool calls.
        let peer = null;
        let microphone = null;
        let meter = null;
        let reconnectTimer = null;
        const reconnectGraceMilliseconds = 20_000;
        let mediaGeneration = 0;
        let events = null;
        const activeResponses = new Set();
        let paceChange = null;
        let paceRequestId = 0;
        const paceTimeoutMilliseconds = 15_000;
        const pacePrecision = 0.001;

        function notify(message) {
            window.HybridWebView.SendRawMessage(JSON.stringify(message));
        }

        // Reports when the microphone hears sound, so the app can show the learner that audio is reaching the call.
        function startMeter(stream) {
            const context = new AudioContext();
            const analyser = context.createAnalyser();
            analyser.fftSize = 512;
            context.createMediaStreamSource(stream).connect(analyser);
            const samples = new Float32Array(analyser.fftSize);
            let hearing = false;
            let quietSince = 0;
            const timer = setInterval(() => {
                analyser.getFloatTimeDomainData(samples);
                const level = Math.sqrt(samples.reduce((sum, sample) => sum + sample * sample, 0) / samples.length);
                const muted = !stream.getAudioTracks().some(track => track.enabled);
                const now = Date.now();
                if (!muted && level > 0.02) {
                    quietSince = now;
                    if (!hearing) {
                        hearing = true;
                        notify({ type: 'microphone', hearing: true });
                    }
                } else if (hearing && now - quietSince > 300) {
                    hearing = false;
                    notify({ type: 'microphone', hearing: false });
                }
            }, 100);
            return { stop: () => { clearInterval(timer); context.close(); } };
        }

        function onProviderEvent(event) {
            switch (event.type) {
                case 'response.created':
                    activeResponses.add(event.response.id);
                    break;
                case 'response.done':
                    activeResponses.delete(event.response.id);
                    sendPendingPace();
                    break;
                case 'session.updated':
                    const speed = event.session?.audio?.output?.speed;
                    if (paceChange?.sent && typeof speed === 'number' && Math.abs(speed - paceChange.speed) < pacePrecision)
                        finishPaceChange('confirmed');
                    break;
                case 'error':
                    if (paceChange?.sent && event.error?.event_id === paceChange.id)
                        finishPaceChange('rejected');
                    break;
                case 'conversation.item.input_audio_transcription.completed':
                    notify({ type: 'transcript', speaker: 'learner', text: event.transcript ?? '' });
                    break;
                case 'response.output_audio_transcript.done':
                    notify({ type: 'transcript', speaker: 'tutor', text: event.transcript ?? '' });
                    break;
                case 'output_audio_buffer.started':
                    notify({ type: 'state', value: 'speaking' });
                    break;
                case 'output_audio_buffer.stopped':
                case 'output_audio_buffer.cleared':
                case 'input_audio_buffer.speech_started':
                    notify({ type: 'state', value: 'listening' });
                    break;
            }
        }

        function finishPaceChange(result) {
            const change = paceChange;
            if (change === null)
                return;
            paceChange = null;
            clearTimeout(change.timer);
            change.resolve(result);
        }

        function sendPendingPace() {
            if (paceChange === null || paceChange.sent || activeResponses.size !== 0 || events?.readyState !== 'open')
                return;
            try {
                events.send(JSON.stringify({
                    type: 'session.update',
                    event_id: paceChange.id,
                    session: { type: 'realtime', audio: { output: { speed: paceChange.speed } } },
                }));
                paceChange.sent = true;
            } catch (error) {
                if (error.name !== 'InvalidStateError' && error.name !== 'OperationError')
                    throw error;
                finishPaceChange('not-sent');
            }
        }

        function setSpeechSpeed(speed) {
            if (![0.8, 1, 1.2].includes(speed) || events === null || events.readyState === 'closed' || paceChange !== null)
                return 'not-sent';
            return new Promise(resolve => {
                paceChange = {
                    speed, resolve, id: `speech-pace-${++paceRequestId}`, sent: false,
                    timer: setTimeout(() => finishPaceChange(paceChange.sent ? 'unconfirmed' : 'not-sent'),
                        paceTimeoutMilliseconds),
                };
                sendPendingPace();
            });
        }

        // Returns the SDP offer, or null when the microphone or peer connection cannot start.
        async function createOffer() {
            hangUp();
            const generation = mediaGeneration;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                });
                if (generation !== mediaGeneration) {
                    stream.getTracks().forEach(track => track.stop());
                    return null;
                }
                microphone = stream;
                const connection = new RTCPeerConnection();
                peer = connection;
                connection.ontrack = event => {
                    if (peer === connection)
                        document.getElementById('remote').srcObject = event.streams[0];
                };
                connection.onconnectionstatechange = () => {
                    if (peer !== connection)
                        return;
                    if (connection.connectionState === 'disconnected') {
                        if (reconnectTimer !== null)
                            return;
                        notify({ type: 'state', value: 'reconnecting' });
                        reconnectTimer = setTimeout(() => {
                            reconnectTimer = null;
                            if (peer === connection && connection.connectionState !== 'connected')
                                notify({ type: 'state', value: 'failed' });
                        }, reconnectGraceMilliseconds);
                    } else if (connection.connectionState === 'connected') {
                        clearTimeout(reconnectTimer);
                        reconnectTimer = null;
                        notify({ type: 'state', value: 'connected' });
                    } else if (connection.connectionState === 'failed') {
                        clearTimeout(reconnectTimer);
                        reconnectTimer = null;
                        notify({ type: 'state', value: 'failed' });
                    }
                };
                microphone.getTracks().forEach(track => peer.addTrack(track, microphone));
                meter = startMeter(microphone);
                const channel = connection.createDataChannel('oai-events');
                events = channel;
                channel.onopen = () => {
                    if (events === channel)
                        sendPendingPace();
                };
                channel.onclose = () => {
                    if (events === channel)
                        finishPaceChange(paceChange?.sent ? 'unconfirmed' : 'not-sent');
                };
                channel.onmessage = message => {
                    if (peer === connection)
                        onProviderEvent(JSON.parse(message.data));
                };
                await connection.setLocalDescription(await connection.createOffer());
                return peer === connection ? connection.localDescription.sdp : null;
            } catch (error) {
                if (generation === mediaGeneration) {
                    console.error(error);
                    hangUp();
                }
                return null;
            }
        }

        async function acceptAnswer(sdp) {
            const connection = peer;
            try {
                await connection.setRemoteDescription({ type: 'answer', sdp: sdp });
                return peer === connection;
            } catch (error) {
                console.error(error);
                return false;
            }
        }

        function setMuted(muted) {
            microphone?.getAudioTracks().forEach(track => { track.enabled = !muted; });
            return true;
        }

        function hangUp() {
            mediaGeneration++;
            finishPaceChange(paceChange?.sent ? 'unconfirmed' : 'not-sent');
            activeResponses.clear();
            events = null;
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
            meter?.stop();
            const connection = peer;
            peer = null;
            connection?.close();
            microphone?.getTracks().forEach(track => track.stop());
            meter = null;
            microphone = null;
            document.getElementById('remote').srcObject = null;
            return true;
        }
    </script>
</head>
<body>
    <audio id="remote" autoplay></audio>
</body>
</html>
