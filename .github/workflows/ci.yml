name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

#Deny all permissions at workflow level; jobs grant only what they need.
permissions: {}

jobs:
  lint:
    uses: f2calv/gha-workflows/.github/workflows/lint.yml@v1
    permissions:
      contents: read

  versioning:
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: read
    with:
      tag-prefix: ''
      tag-and-release: false

  # TODO: verify released shared-workflow SDK 11 support after GA before merging this platform upgrade.
  build:
    needs: [versioning]
    permissions:
      contents: read
    uses: f2calv/gha-workflows/.github/workflows/app-build-dotnet.yml@v1
    with:
      version: ${{ needs.versioning.outputs.version }}
      solution-name: tutorizr.Release.slnx
      dotnet-test-args: '["--filter-not-trait", "Category=Integration"]'

  helm:
    uses: f2calv/gha-workflows/.github/workflows/helm-lint.yml@v1
    with:
      charts: '["charts/tutorizr"]'
    permissions:
      contents: read

  image:
    needs: [versioning, build]
    permissions:
      contents: read
      packages: write #push to ghcr.io
    uses: f2calv/gha-workflows/.github/workflows/container-image-build.yml@v1
    with:
      registry: ghcr.io/${{ github.repository_owner }}
      tag: ${{ needs.versioning.outputs.version }}
      #A pull request proves the image builds on every architecture without publishing it.
      push-image: ${{ github.event_name != 'pull_request' }}
      #The container starts a long-lived host, so the smoke test asserts the startup validation
      #instead: an unknown feature name must fail fast rather than boot a misconfigured role.
      smoke-test: |
        ! docker run --rm -e CasCap__FeatureConfig__EnabledFeatures=NotAFeature $IMAGE

  chart:
    needs: [versioning, image]
    permissions:
      contents: read
      packages: write #push the OCI chart to ghcr.io
    uses: f2calv/gha-workflows/.github/workflows/helm-chart-package.yml@v1
    with:
      tag: ${{ needs.versioning.outputs.version }}
      image-registry: ghcr.io/${{ github.repository_owner }}
      image-repository: tutorizr
      chart-registry: ghcr.io
      chart-registry-username: ${{ github.repository_owner }}
      chart-repository: ${{ github.repository_owner }}/charts/tutorizr
      chart-path: ./charts/tutorizr
      #The umbrella chart owns no top-level image value; its workload alias carries its own, so
      #chart-testing must not inject --set image.tag.
      has-image: false
      push-chart: ${{ github.event_name != 'pull_request' }}

  #Unsigned Android validation bundle.
  build-android:
    needs: [versioning]
    uses: f2calv/gha-workflows/.github/workflows/deploy-maui-android.yml@v1
    permissions:
      contents: read
    with:
      project: src/CasCap.App.Maui/CasCap.App.Maui.csproj
      app-display-version: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
      app-version-code: ${{ github.run_number }}

  #Self-contained unpackaged Windows development build, uploaded as a short-lived artifact for manual testing.
  build-windows:
    needs: [versioning]
    uses: f2calv/gha-workflows/.github/workflows/build-maui-windows.yml@v1
    permissions:
      contents: read
    with:
      project: src/CasCap.App.Maui/CasCap.App.Maui.csproj
      app-display-version: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
      app-version-code: ${{ github.run_number }}

  #Sideload APK signed with the shared sideload keystore, uploaded as a short-lived artifact for manual installs.
  #Its clock-based version code matches build-apk.ps1, so CI and local APKs update each other in place.
  #Dependabot and fork pull requests receive no secrets, so they cannot sign; build-android still validates them.
  build-apk:
    needs: [versioning]
    if: github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: f2calv/gha-workflows/.github/workflows/deploy-maui-android.yml@v1
    permissions:
      contents: read
    with:
      project: src/CasCap.App.Maui/CasCap.App.Maui.csproj
      package-format: apk
      sign: true
      version-code-from-clock: true
      app-display-version: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
      artifact-name: android-apk-${{ needs.versioning.outputs.version }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIDELOAD_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: dcim-sideload

  release:
    needs: [lint, versioning, build, helm, image, chart, build-android, build-windows, build-apk]
    if: needs.versioning.outputs.release-exists == 'false'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: f2calv/gha-workflows/.github/workflows/gha-release-versioning.yml@v1
    permissions:
      contents: write
    with:
      semVer: ${{ format('{0}.{1}.{2}', needs.versioning.outputs.major, needs.versioning.outputs.minor, needs.versioning.outputs.patch) }}
      tag-prefix: ''
      move-major-tag: false
